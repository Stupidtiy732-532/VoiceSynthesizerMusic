
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesynth"
version = "0.1.0"
description = "A multi-engine singing voice synthesizer"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "soundfile>=0.12"
]

[tool.setuptools.packages.find]
include = ["voicesynth*"]